<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Distant Galaxy - soft spiral with star dust -->
  <defs>
    <!-- Core glow -->
    <radialGradient id="galaxyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,250,230,0.25)"/>
      <stop offset="15%" stop-color="rgba(255,240,200,0.15)"/>
      <stop offset="35%" stop-color="rgba(200,180,255,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Arm gradient -->
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(180,170,255,0.12)"/>
      <stop offset="50%" stop-color="rgba(200,190,255,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- Dust cloud -->
    <radialGradient id="dustCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(150,140,200,0.08)"/>
      <stop offset="70%" stop-color="rgba(100,120,180,0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Galaxy center glow -->
  <ellipse cx="400" cy="400" rx="120" ry="80" fill="url(#galaxyCore)" transform="rotate(-25 400 400)"/>
  
  <!-- Spiral arms (simplified paths) -->
  <g opacity="0.6" transform="rotate(-25 400 400)">
    <!-- Arm 1 -->
    <path d="M400,400 Q480,350 550,380 T700,320" stroke="url(#armGrad)" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M400,400 Q450,320 500,300 T620,220" stroke="url(#armGrad)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <!-- Arm 2 (opposite) -->
    <path d="M400,400 Q320,450 250,420 T100,480" stroke="url(#armGrad)" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M400,400 Q350,480 300,500 T180,580" stroke="url(#armGrad)" stroke-width="25" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Dust clouds around arms -->
  <ellipse cx="550" cy="350" rx="100" ry="60" fill="url(#dustCloud)" transform="rotate(-15 550 350)"/>
  <ellipse cx="250" cy="450" rx="90" ry="55" fill="url(#dustCloud)" transform="rotate(20 250 450)"/>
  <ellipse cx="480" cy="280" rx="70" ry="40" fill="url(#dustCloud)" transform="rotate(-30 480 280)"/>
  <ellipse cx="320" cy="520" rx="65" ry="45" fill="url(#dustCloud)" transform="rotate(10 320 520)"/>
  
  <!-- Scattered star dust (tiny dots) -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="420" cy="380" r="1.5"/>
    <circle cx="380" cy="420" r="1.2"/>
    <circle cx="450" cy="360" r="1"/>
    <circle cx="350" cy="440" r="1.3"/>
    <circle cx="480" cy="340" r="0.8"/>
    <circle cx="320" cy="460" r="1.1"/>
    <circle cx="510" cy="370" r="1"/>
    <circle cx="290" cy="430" r="0.9"/>
    <circle cx="440" cy="320" r="1.2"/>
    <circle cx="360" cy="480" r="1"/>
    <circle cx="530" cy="390" r="0.7"/>
    <circle cx="270" cy="410" r="1.1"/>
    <circle cx="560" cy="340" r="0.8"/>
    <circle cx="240" cy="460" r="0.9"/>
    <circle cx="470" cy="290" r="1"/>
    <circle cx="330" cy="510" r="0.8"/>
    <circle cx="590" cy="360" r="0.6"/>
    <circle cx="210" cy="440" r="0.7"/>
    <circle cx="500" cy="260" r="0.8"/>
    <circle cx="300" cy="540" r="0.6"/>
  </g>
  
  <!-- Fainter outer stars -->
  <g fill="rgba(200,210,255,0.25)">
    <circle cx="620" cy="300" r="1.5"/>
    <circle cx="180" cy="500" r="1.3"/>
    <circle cx="650" cy="380" r="1"/>
    <circle cx="150" cy="420" r="1.2"/>
    <circle cx="700" cy="350" r="0.8"/>
    <circle cx="100" cy="450" r="0.9"/>
    <circle cx="580" cy="250" r="1.1"/>
    <circle cx="220" cy="550" r="1"/>
    <circle cx="430" cy="220" r="1.3"/>
    <circle cx="370" cy="580" r="1.1"/>
    <circle cx="520" cy="200" r="0.9"/>
    <circle cx="280" cy="600" r="0.8"/>
  </g>
</svg>
