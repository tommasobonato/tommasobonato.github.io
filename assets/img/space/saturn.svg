<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Saturn - enhanced with banding, highlight, detailed rings -->
  <defs>
    <!-- Planet body gradient -->
    <linearGradient id="saturnBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e4c0"/>
      <stop offset="25%" stop-color="#e8d5a3"/>
      <stop offset="50%" stop-color="#d4c191"/>
      <stop offset="75%" stop-color="#c9b07a"/>
      <stop offset="100%" stop-color="#a08050"/>
    </linearGradient>
    <!-- Shadow overlay -->
    <linearGradient id="saturnShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(50,35,15,0.45)"/>
      <stop offset="60%" stop-color="transparent"/>
    </linearGradient>
    <!-- Soft highlight -->
    <radialGradient id="saturnHighlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,240,0.35)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Outer ring gradient (brighter, ice-like) -->
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(220,210,180,0.5)"/>
      <stop offset="30%" stop-color="rgba(200,185,150,0.7)"/>
      <stop offset="50%" stop-color="rgba(170,150,110,0.4)"/>
      <stop offset="70%" stop-color="rgba(195,175,140,0.65)"/>
      <stop offset="100%" stop-color="rgba(210,195,160,0.45)"/>
    </linearGradient>
    <!-- Inner ring gradient (darker, rocky) -->
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(160,140,100,0.4)"/>
      <stop offset="50%" stop-color="rgba(140,120,85,0.6)"/>
      <stop offset="100%" stop-color="rgba(130,110,75,0.35)"/>
    </linearGradient>
    <!-- Ring shadow (where ring crosses planet) -->
    <linearGradient id="ringShadowOnPlanet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(40,30,15,0.15)"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- Clip paths for ring layering -->
    <clipPath id="ringBack">
      <rect x="0" y="0" width="200" height="60"/>
    </clipPath>
    <clipPath id="ringFront">
      <rect x="0" y="60" width="200" height="60"/>
    </clipPath>
  </defs>
  
  <!-- Ring back (behind planet) - two-tone -->
  <g clip-path="url(#ringBack)">
    <ellipse cx="100" cy="60" rx="95" ry="22" fill="none" stroke="url(#ringOuter)" stroke-width="10" opacity="0.65"/>
    <ellipse cx="100" cy="60" rx="82" ry="19" fill="none" stroke="url(#ringInner)" stroke-width="8" opacity="0.55"/>
    <ellipse cx="100" cy="60" rx="70" ry="16" fill="none" stroke="url(#ringOuter)" stroke-width="4" opacity="0.4"/>
  </g>
  
  <!-- Planet body -->
  <circle cx="100" cy="60" r="35" fill="url(#saturnBody)"/>
  
  <!-- Atmospheric bands (more detail) -->
  <ellipse cx="100" cy="48" rx="33" ry="3" fill="rgba(200,175,130,0.18)"/>
  <ellipse cx="100" cy="54" rx="34" ry="4" fill="rgba(170,140,95,0.22)"/>
  <ellipse cx="100" cy="62" rx="34" ry="5" fill="rgba(190,160,110,0.15)"/>
  <ellipse cx="100" cy="70" rx="32" ry="4" fill="rgba(180,150,100,0.2)"/>
  
  <!-- Ring shadow on planet surface -->
  <ellipse cx="100" cy="60" rx="35" ry="35" fill="url(#ringShadowOnPlanet)"/>
  
  <!-- Shadow overlay -->
  <circle cx="100" cy="60" r="35" fill="url(#saturnShadow)"/>
  
  <!-- Highlight -->
  <circle cx="100" cy="60" r="35" fill="url(#saturnHighlight)"/>
  
  <!-- Ring front (in front of planet) - two-tone -->
  <g clip-path="url(#ringFront)">
    <ellipse cx="100" cy="60" rx="95" ry="22" fill="none" stroke="url(#ringOuter)" stroke-width="10" opacity="0.75"/>
    <ellipse cx="100" cy="60" rx="82" ry="19" fill="none" stroke="url(#ringInner)" stroke-width="8" opacity="0.6"/>
    <ellipse cx="100" cy="60" rx="70" ry="16" fill="none" stroke="url(#ringOuter)" stroke-width="4" opacity="0.45"/>
  </g>
</svg>
</svg>
